# Trading stack for OCI Ampere A1 (ARM64)
# Hermes, Vibe-Trading and LiteLLM share the host network.
# World Monitor remains deployed on Vercel and is not installed here.

services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    network_mode: host

    volumes:
      - ~/.hermes:/opt/data

    environment:
      HERMES_UID: ${HERMES_UID:-1000}
      HERMES_GID: ${HERMES_GID:-1000}
      HERMES_DASHBOARD: ${HERMES_DASHBOARD:-1}
      HERMES_DASHBOARD_HOST: 127.0.0.1
      API_SERVER_ENABLED: ${API_SERVER_ENABLED:-false}
      API_SERVER_HOST: 127.0.0.1
      API_SERVER_KEY: ${API_SERVER_KEY:-}

    command: ["gateway", "run"]

    deploy:
      resources:
        limits:
          cpus: "0.6"
          memory: 3g
        reservations:
          cpus: "0.3"
          memory: 1g

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  vibe-trading:
    build:
      context: .
      dockerfile: vibe-trading.Dockerfile
      args:
        VIBE_TRADING_VERSION: v0.1.14

    image: vibe-trading:arm64
    container_name: vibe-trading
    restart: unless-stopped
    network_mode: host

    volumes:
      - vibe_data:/home/vibe/.vibe-trading

    environment:
      # Vibe-Trading v0.1.14 configures its LLM through LangChain-style
      # variables (see agent/.env.example upstream). LiteLLM is
      # OpenAI-compatible, so the provider stays "openai" and the base
      # URL points at the local LiteLLM gateway. LANGCHAIN_MODEL_NAME is
      # a LiteLLM model-group alias, not a real provider model.
      LANGCHAIN_PROVIDER: openai
      LANGCHAIN_MODEL_NAME: ${VIBE_TRADING_MODEL:-vibe-trading-critical}
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY:-}
      OPENAI_BASE_URL: http://127.0.0.1:4000/v1
      LANGCHAIN_TEMPERATURE: "0.0"
      TIMEOUT_SECONDS: "180"
      MAX_RETRIES: "2"
      # Set VIBE_TRADING_API_AUTH_KEY in .env before making :8899
      # reachable beyond localhost. Empty keeps dev mode.
      API_AUTH_KEY: ${VIBE_TRADING_API_AUTH_KEY:-}

    deploy:
      resources:
        limits:
          cpus: "1.2"
          memory: 7g
        reservations:
          cpus: "0.4"
          memory: 2g

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    restart: unless-stopped
    # Host network with a loopback bind: Vibe-Trading and Hermes reach it
    # at 127.0.0.1:4000 and nothing is exposed on the OCI public interface.
    network_mode: host

    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro

    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-change-me}

    command:
      ["--config", "/app/config.yaml", "--host", "127.0.0.1", "--port", "4000"]

    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 1g
        reservations:
          cpus: "0.1"
          memory: 256m

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # seeds-lite feeds the fork's Upstash Redis with the keyless seeders the
  # Vercel MCP tools need (news, UCDP, GDELT, HAPI conflict). Independent of
  # the operator-side Railway relay. See seeds-lite/README.md.
  seeds-lite:
    build:
      context: ../..
      dockerfile: deploy/oci/seeds-lite/Dockerfile
    image: seeds-lite:arm64
    container_name: seeds-lite
    restart: unless-stopped

    volumes:
      - seeds_lite_data:/var/lib/seeds-lite

    environment:
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # UCDP now gates the GED API behind a free access token
      # (x-ucdp-access-token); without it the ucdp seeder gets 401.
      UCDP_ACCESS_TOKEN: ${UCDP_ACCESS_TOKEN:-}
      # seed-insights warms its news digest via the fork's own Vercel RPC
      # (list-feed-digest). Without these, the default hits the operator's
      # api.worldmonitor.app and is rejected (Origin-only) -> empty digest
      # -> insights runs skip their write. Mirror the GitHub secrets used by
      # .github/workflows/seed-upstash.yml.
      API_BASE_URL: ${API_BASE_URL:-}
      WORLDMONITOR_RELAY_KEY: ${WORLDMONITOR_RELAY_KEY:-}
      # social-velocity: Reddit 403s the OCI datacenter IP on the anonymous
      # .json API (seen on first deploy). The relay ops uses ScrapeCreators as
      # its preferred Reddit path — mirror it so the fork gets the same data.
      # Optional: without it the seeder logs the 403 and retries next tick.
      SCRAPECREATORS_API_KEY: ${SCRAPECREATORS_API_KEY:-}
      TZ: ${TZ:-UTC}

    # The entrypoint fails loudly at startup if the Upstash vars are missing,
    # so a half-configured .env can never silently produce empty seeds.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1g
        reservations:
          cpus: "0.1"
          memory: 256m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  vibe_data:
    name: vibe_data
  seeds_lite_data:
    name: seeds_lite_data

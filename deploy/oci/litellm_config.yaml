# LiteLLM gateway for Vibe-Trading
# Secrets are read from the environment; do not put keys in this file.

model_list:
  # Single provider, single key: one credential in .env serves both aliases
  # (free tier, ultra-low latency). Missing/invalid provider keys are the #1
  # field failure: an entry whose key is absent wastes router retries, and a
  # bad key surfaces as an upstream 401 relayed by LiteLLM (the gateway
  # itself is fine — the router reached it). Keep at least one entry below
  # with a real key in .env.
  #
  # To add another provider, append an entry with the SAME model_name alias
  # and set its key in .env, e.g.:
  #   - model_name: vibe-trading-critical
  #     litellm_params:
  #       model: gemini/gemini-2.5-flash
  #       api_key: os.environ/GEMINI_API_KEY
  # (deepseek/deepseek-chat with a DEEPSEEK_API_KEY, or openrouter/<slug>
  # with credits, work the same way. The old OpenRouter free alias was
  # retired upstream with HTTP 404 "unavailable for free" — paid OpenRouter
  # models are fine.)
  - model_name: vibe-trading-critical
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY

  - model_name: vibe-trading-utility
    litellm_params:
      model: groq/llama-3.1-8b-instant
      api_key: os.environ/GROQ_API_KEY

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  retry_after: 2
  timeout: 180
  allowed_fails: 2
  cooldown_time: 60
  fallbacks:
    - {"vibe-trading-critical": ["vibe-trading-utility"]}
    - {"vibe-trading-utility": ["vibe-trading-critical"]}

litellm_settings:
  drop_params: true
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

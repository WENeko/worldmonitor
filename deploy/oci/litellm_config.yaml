# LiteLLM gateway for Vibe-Trading
# Secrets are read from the environment; do not put keys in this file.

model_list:
  # Provider keys live in .env — never in this file. Each entry is one
  # deployment; the router shuffles across deployments in a model group and
  # isolates failures per deployment (a provider 429 cools only its own
  # deployment, then the group falls through to the next one).
  #
  # Quota model (2026-09): Groq's free tier caps ~6k tokens/min per ORG, so
  # one 30k-token agent prompt can exhaust it for ~200 s. The Gemini free
  # tier (gemini-2.5-flash: 15 RPM, 1M context) carries that load comfortably
  # and has an INDEPENDENT quota, so each group pairs Gemini (primary) with
  # two Groq keys as fallback. The second Groq key must belong to a different
  # Groq org to add independent capacity — two keys from one console share
  # the same ceiling and cool down together.
  #
  # Model ids (2026-09): Groq decommissioned the llama-3.3/3.1 line on
  # 2026-08-16 (upstream `model_not_found`); replacements per Groq's
  # deprecation page are openai/gpt-oss-120b (critical) and
  # openai/gpt-oss-20b (utility), passed through the LiteLLM `groq/` prefix.
  # The old OpenRouter free alias was retired upstream (HTTP 404).
  - model_name: vibe-trading-critical
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: vibe-trading-critical
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY

  - model_name: vibe-trading-critical
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY_2

  - model_name: vibe-trading-utility
    litellm_params:
      model: gemini/gemini-2.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY

  - model_name: vibe-trading-utility
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY

  - model_name: vibe-trading-utility
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY_2

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  retry_after: 2
  timeout: 180
  allowed_fails: 2
  cooldown_time: 60
  fallbacks:
    - {"vibe-trading-critical": ["vibe-trading-utility"]}
    - {"vibe-trading-utility": ["vibe-trading-critical"]}

litellm_settings:
  drop_params: true
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

name: Sync fork main and Vercel branch

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-vercel-branch
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: koala73/worldmonitor
  VERCEL_BRANCH: vercel
  CANONICAL_BRANCH: main

jobs:
  sync:
    if: github.repository_owner == 'WENeko'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Synchronize application code with upstream
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream main

          mkdir -p /tmp/fork-files/scripts /tmp/fork-files/deploy
          cp scripts/prepare-vercel.mjs /tmp/fork-files/scripts/ 2>/dev/null || true
          cp scripts/build-crawlable-corpus.mjs /tmp/fork-files/scripts/ 2>/dev/null || true
          cp scripts/fork-ensure-run-seeders-patches.mjs /tmp/fork-files/scripts/ 2>/dev/null || true
          cp ARCHITECTURE.md /tmp/fork-files/ARCHITECTURE.md 2>/dev/null || true

          git checkout -B main origin/main
          git diff --name-only origin/main upstream/main \
            -- . ':!.github/workflows/' \
            | while IFS= read -r file; do
                git checkout upstream/main -- "$file" 2>/dev/null || true
              done
          git diff --diff-filter=A --name-only origin/main upstream/main \
            -- . ':!.github/workflows/' \
            | while IFS= read -r file; do
                git checkout upstream/main -- "$file" 2>/dev/null || true
              done
          git diff --diff-filter=D --name-only origin/main upstream/main \
            -- . ':!.github/workflows/' \
            | while IFS= read -r file; do git rm "$file" 2>/dev/null || true; done

          cp /tmp/fork-files/scripts/prepare-vercel.mjs scripts/ 2>/dev/null || true
          cp /tmp/fork-files/scripts/build-crawlable-corpus.mjs scripts/ 2>/dev/null || true
          cp /tmp/fork-files/scripts/fork-ensure-run-seeders-patches.mjs scripts/ 2>/dev/null || true
          cp /tmp/fork-files/ARCHITECTURE.md ARCHITECTURE.md 2>/dev/null || true

          # Validate canonical main before generating the adapted branch.
          npm ci --ignore-scripts
          node scripts/source-attribution.mjs --write
          node scripts/generate-inventory-facts.mjs
          npm run inventory:facts

          # Keep the validated source tree available while creating vercel;
          # never copy the pre-adaptation script back into the working tree.
          git add -A
          git diff --cached --quiet && echo "No changes" || git commit -m 'chore: sync application code and generated manifests from upstream/main'
          git push --force-with-lease origin HEAD:main

      # The sync above overwrites scripts/run-seeders.sh with the upstream
      # version, which DROPS the fork patches (they are not upstream). Re-apply
      # them immediately on the freshly-synced main, before any seed run. This
      # closes the window between "sync wiped the patches" and "next seed run":
      # previously the fix only happened inside seed-upstash.yml at run time,
      # leaving run-seeders.sh unpatched for up to 12h after each sync. The
      # re-applier is fork-owned and preserved above, so it survives the sync.
      - name: Re-apply fork patches after upstream sync
        run: |
          git restore --source=HEAD -- scripts/run-seeders.sh 2>/dev/null || true
          node scripts/fork-ensure-run-seeders-patches.mjs
          if git diff --quiet -- scripts/run-seeders.sh; then
            echo "Fork patches intact — no re-apply commit needed"
          else
            git add scripts/run-seeders.sh
            git commit -m 'chore: re-apply fork seed patches after upstream sync (auto)'
            git push origin HEAD:main
            echo 'Re-applied fork patches and pushed to main'
          fi

      - name: Generate Vercel deployment files
        run: |
          node scripts/prepare-vercel.mjs --force
          # The adapted tree intentionally removes API route sources. Vercel's
          # postinstall must not rescan that transformed tree; inventory was
          # already validated on canonical main above.
          # The adapted branch keeps the manifest produced by main. Do not
          # invoke source-attribution again after route staging: its scanner
          # intentionally cannot see moved api/ files.
          git diff --check

      - name: Preserve build-time generated paths
        run: |
          if [ -d ".vercel-api-routes/mcp/skill-extension" ]; then
            mkdir -p api/mcp/skill-extension
            cp .vercel-api-routes/mcp/skill-extension/*.ts api/mcp/skill-extension/
          fi

      - name: Validate generated deployment
        run: |
          test -f api/index.ts
          test -f api/mcp/skill-extension/generated.ts
          test -d .vercel-api-routes
          git diff --check

      - name: Publish adapted Vercel branch
        run: |
          git checkout -B "${VERCEL_BRANCH}" HEAD
          node -e "const fs=require('fs'); const p='package.json'; const j=JSON.parse(fs.readFileSync(p,'utf8')); j.scripts.postinstall='cross-env npm_config_allow_scripts= npm --prefix blog-site ci --prefer-offline'; j.scripts['prebuild:full']='npm run product:facts:vercel'; j.scripts['product:facts:vercel']='node --import tsx scripts/generate-product-config.mjs && node --import tsx scripts/generate-public-product-facts.mjs'; j.scripts['build:crawlable-corpus']='node --import tsx scripts/build-crawlable-corpus.mjs --skip-source-attribution'; fs.writeFileSync(p, JSON.stringify(j,null,2)+'\\n');"
          git add -A
          git diff --cached --quiet && echo "No changes to vercel branch" && exit 0
          git commit -m 'chore(vercel): regenerate deployment branch from upstream/main'
          git push --force origin "HEAD:${VERCEL_BRANCH}"

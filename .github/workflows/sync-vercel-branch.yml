name: Sync fork main and Vercel branch

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-vercel-branch
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: koala73/worldmonitor
  VERCEL_BRANCH: vercel
  CANONICAL_BRANCH: main

jobs:
  sync:
    if: github.repository_owner == 'WENeko'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANONICAL_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Synchronize fork main with upstream main
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream main
          git checkout -B "${CANONICAL_BRANCH}" "upstream/main"
          # GitHub Apps cannot push .github/workflows/ files.
          # Remove them from the index so they are excluded from the push.
          git rm -r --cached .github/workflows/ 2>/dev/null || true
          git commit -m "chore(ci): remove workflow files from sync index" --allow-empty || true
          git push --force-with-lease origin "HEAD:${CANONICAL_BRANCH}"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare Vercel deployment tree
        run: node scripts/prepare-vercel.mjs --force

      - name: Validate generated deployment
        run: |
          git diff --check
          test -f api/index.ts
          test -d .vercel-api-routes
          npm run typecheck

      - name: Publish adapted Vercel branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "${VERCEL_BRANCH}"
          git checkout -B "${VERCEL_BRANCH}" "origin/${VERCEL_BRANCH}"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'chore(vercel): regenerate deployment branch from upstream/main'
          git push origin "HEAD:${VERCEL_BRANCH}"

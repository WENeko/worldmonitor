name: Sync fork main and Vercel branch

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-vercel-branch
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: koala73/worldmonitor
  VERCEL_BRANCH: vercel
  CANONICAL_BRANCH: main

jobs:
  sync:
    if: github.repository_owner == 'WENeko'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANONICAL_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Synchronize fork main with upstream main
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream main

          # Save fork-specific files that don't exist in upstream
          mkdir -p /tmp/fork-files/scripts /tmp/fork-files/deploy
          cp scripts/prepare-vercel.mjs /tmp/fork-files/scripts/ 2>/dev/null || true
          cp scripts/source-attribution.mjs /tmp/fork-files/scripts/ 2>/dev/null || true
          cp -r deploy/oci /tmp/fork-files/deploy/ 2>/dev/null || true

          # Start from origin/main to preserve existing workflow files
          git checkout -B "${CANONICAL_BRANCH}" "origin/main"

          # Apply all non-workflow file changes from upstream/main
          git diff --name-only origin/main upstream/main \
            -- . ':!.github/workflows/' \
            | while IFS= read -r file; do
                git checkout upstream/main -- "$file" 2>/dev/null || true
              done

          # Also pick up any new files from upstream that aren't workflows
          git diff --diff-filter=A --name-only origin/main upstream/main \
            -- . ':!.github/workflows/' \
            | while IFS= read -r file; do
                git checkout upstream/main -- "$file" 2>/dev/null || true
              done

          # Remove files deleted in upstream that aren't workflows
          git diff --diff-filter=D --name-only origin/main upstream/main \
            -- . ':!.github/workflows/' \
            | while IFS= read -r file; do
                git rm "$file" 2>/dev/null || true
              done

          # Restore fork-specific files
          cp /tmp/fork-files/scripts/prepare-vercel.mjs scripts/ 2>/dev/null || true
          cp /tmp/fork-files/scripts/source-attribution.mjs scripts/ 2>/dev/null || true
          cp -r /tmp/fork-files/deploy/oci deploy/ 2>/dev/null || true

          # Commit and push only if there are changes
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: sync application code from upstream/main"
          git push --force-with-lease origin "HEAD:${CANONICAL_BRANCH}"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Vercel deployment files
        run: |
          echo "=== Running prepare-vercel.mjs ==="
          node scripts/prepare-vercel.mjs --force 2>&1 || {
            echo "=== prepare-vercel.mjs failed ==="
            node scripts/source-attribution.mjs 2>&1 || true
            echo "=== Continuing with partial deployment ==="
          }

      - name: Validate generated deployment
        run: |
          echo "=== Checking generated files ==="
          ls -la .vercel-api-routes/ 2>/dev/null | head -20 || echo "No .vercel-api-routes"
          ls -la api/index.ts 2>/dev/null || echo "No api/index.ts"
          git diff --check || true

      - name: Publish adapted Vercel branch
        run: |
          # Copy api/ files that build scripts need to write to back from staging
          # prepare-vercel.mjs moves routes to .vercel-api-routes/ but build scripts
          # still read/write from api/. The module loader hook handles reads at runtime,
          # but build-time writes need the original paths to exist.
          if [ -d ".vercel-api-routes/mcp/skill-extension" ]; then
            mkdir -p api/mcp/skill-extension
            cp .vercel-api-routes/mcp/skill-extension/*.ts api/mcp/skill-extension/ 2>/dev/null || true
          fi

          # Create or reset vercel branch from current HEAD
          git checkout -B "${VERCEL_BRANCH}" HEAD

          # Stage all files including the restored api/ copies
          git add -A
          git diff --cached --quiet && echo "No changes to vercel branch" && exit 0
          git commit -m 'chore(vercel): regenerate deployment branch from upstream/main'
          git push --force origin "HEAD:${VERCEL_BRANCH}"

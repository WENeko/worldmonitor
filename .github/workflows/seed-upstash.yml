# Populate the fork's Upstash Redis with the WorldMonitor seeders.
#
# The dashboard's /api/bootstrap reads its initial state from Redis. Without
# seeded data every panel is empty, so to make the deployed fork useful the
# Redis backing it must be filled. Upstream does this with a Railway cron; this
# fork has no Railway, so this manual workflow runs the same seeders against
# the Upstash database you configured in Vercel.
#
# Trigger it from the GitHub UI: Actions -> "Populate Upstash Redis" ->
# "Run workflow". It is workflow_dispatch ONLY, so it never consumes
# free-tier minutes automatically.
#
# Required repo secrets:
#   UPSTASH_REDIS_REST_URL    e.g. https://<db>-<region>.upstash.io
#   UPSTASH_REDIS_REST_TOKEN  the REST token, not the master password
#
# Optional secret (add the same source keys you want seeds to use):
#   GROQ_API_KEY, OPENROUTER_API_KEY, NASA_FIRMS_API_KEY, FINNHUB_API_KEY,
#   FRED_API_KEY, EIA_API_KEY, AISSTREAM_API_KEY, ACLED_* / CLOUDFLARE_API_TOKEN,
#   AVIATIONSTACK_API, OPENAQ_API_KEY, WAQI_API_KEY ...
# Seeders without their key are SKIPPED gracefully and the rest still populate.

name: Populate Upstash Redis

on:
  schedule:
    # Fork housekeeping: re-seed Upstash so the dashboard's seed-backed panels
    # (sanctions, conflict, market quotes, weather, ...) stay populated. The
    # fork repo is public, so GitHub Actions minutes are free; the binding
    # constraints are the Upstash free-tier command meter (500k/month) and
    # upstream API rate limits.
    #
    # FORK CADENCE: 12h, not 6h. Moved from */6 to */12 to stay under the NASA
    # FIRMS free-tier quota (2000 req/month). seed-fire-detections issues 27
    # calls/run (3 satellites x 9 regions, then 2-attempt retries on failures
    # only); at 6h that is ~2160+/mo when any retries fire — over quota. At 12h
    # it is ~1080/mo with clear headroom for retries, and stays under even if
    # upstream's own duplicate run lands. Fire/market freshness is the tradeoff
    # (fire data lags up to 12h), but a globally-covered panel beats a faster
    # Canada-only one. This file is fork-owned (never overwritten by upstream
    # sync) so the cadence is persistent.
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch whose seeders to run'
        required: false
        default: 'main'
        type: string

concurrency:
  group: seed-upstash
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'main' }}

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Seeders only need the scripts/ dependency set (15 packages). The root
      # npm install is huge and its postinstall runs inventory:facts; avoid it.
      - name: Install seeder dependencies
        run: npm --prefix scripts ci --prefer-offline

      # scripts/run-seeders.sh is synced from upstream and carries fork-only
      # patches (consumer-prices --force, heavy/monthly exclusion, failure
      # diagnostic). An upstream sync can wipe them; this step re-applies them
      # idempotently right before the run so the fork behavior is guaranteed
      # (fails loudly if upstream refactored the file and an anchor is missing).
      - name: Ensure fork patches in run-seeders.sh
        run: node scripts/fork-ensure-run-seeders-patches.mjs

      - name: Run seeders against Upstash
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          # Optional source keys (empty when the secret is unset; seeders skip).
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NASA_FIRMS_API_KEY: ${{ secrets.NASA_FIRMS_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          ACLED_ACCESS_TOKEN: ${{ secrets.ACLED_ACCESS_TOKEN }}
          ACLED_EMAIL: ${{ secrets.ACLED_EMAIL }}
          ACLED_PASSWORD: ${{ secrets.ACLED_PASSWORD }}
          AVIATIONSTACK_API: ${{ secrets.AVIATIONSTACK_API }}
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          WAQI_API_KEY: ${{ secrets.WAQI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WINDY_API_KEY: ${{ secrets.WINDY_API_KEY }}
          USDA_FAS_PSD_API_KEY: ${{ secrets.USDA_FAS_PSD_API_KEY }}
          EXA_API_KEYS: ${{ secrets.EXA_API_KEYS }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          COMTRADE_API_KEYS: ${{ secrets.COMTRADE_API_KEYS }}
          WORLDMONITOR_SEED_REFRESH_KEY: ${{ secrets.WORLDMONITOR_SEED_REFRESH_KEY }}
          # Fork wiring for seed-insights: warm the news digest from THIS
          # fork's own Vercel deployment instead of the upstream API, using a
          # relay key that matches Vercel's WORLDMONITOR_VALID_KEYS.
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          WORLDMONITOR_RELAY_KEY: ${{ secrets.WORLDMONITOR_RELAY_KEY }}
        run: |
          if [ -z "$UPSTASH_REDIS_REST_URL" ] || [ -z "$UPSTASH_REDIS_REST_TOKEN" ]; then
            echo "::error::UPSTASH_REDIS_REST_URL / UPSTASH_REDIS_REST_TOKEN are required repo secrets."
            exit 1
          fi
          sh scripts/run-seeders.sh